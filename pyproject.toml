[project]
name = "cppi-lab"
version = "2.0.0"
description = "CPPI-Lab: back-testing and educational workbench for a signal-modulated Bitcoin CPPI strategy with a hysteresis deadband"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "PySide6>=6.7",
    "PySide6-QtAds>=4.3",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1.7",
    "numba>=0.59",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
]

[project.scripts]
cppi-lab = "cppi_lab.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cppi_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
qt_api = "pyside6"
markers = [
    "ui: tests that build Qt widgets (run offscreen)",
    "web: tests that need QtWebEngine",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # pyqtgraph 0.14 assigns to ndarray.shape, which NumPy 2.5 deprecates.
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "cppi_lab/docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "PT", "N"]
ignore = [
    "N803",   # math-style argument names (P_liq, ...) mirror the specification
    "N806",
    "RUF001", # the UI and docs legitimately use typographic characters
    "RUF002",
    "RUF003",
    "PT011",
]

[tool.ruff.lint.per-file-ignores]
# Qt virtual overrides and signals are camelCase; QModelIndex() defaults mirror the Qt API.
"cppi_lab/ui/*.py" = ["N802", "N815", "N813", "N814", "B008"]
"cppi_lab/ui/theme.py" = ["N802", "N815", "E501"]
"tests/*.py" = ["N802", "N813"]
"scripts/*.py" = ["N813"]

[tool.mypy]
python_version = "3.12"
files = ["cppi_lab", "scripts", "tests"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["numba", "numba.*", "pyqtgraph", "pyqtgraph.*", "PySide6QtAds", "OpenGL", "OpenGL.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# pytest-qt and Hypothesis ship partial annotations.
module = ["tests.*"]
disallow_untyped_calls = false
disallow_untyped_decorators = false
